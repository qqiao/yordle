runtime: go125

handlers:
  - url: /admin.*
    script: auto
    secure: always
    login: admin

  - url: /robots.txt
    static_files: robots.txt
    upload: robots.txt
    secure: always
    http_headers:
      Strict-Transport-Security: 'max-age=63072000; includeSubDomains; preload'

  - url: /assets
    static_dir: assets
    secure: always
    expiration: '0'
    http_headers:
      Strict-Transport-Security: 'max-age=63072000; includeSubDomains; preload'
      X-Content-Type-Options: 'nosniff'

  - url: /favicon.ico
    static_files: favicon.ico
    upload: favicon.ico
    secure: always
    http_headers:
      Strict-Transport-Security: 'max-age=63072000; includeSubDomains; preload'
      X-Content-Type-Options: 'nosniff'

  - url: /manifest.json
    static_files: manifest.json
    upload: manifest.json
    secure: always
    mime_type: 'application/manifest+json'
    http_headers:
      Strict-Transport-Security: 'max-age=63072000; includeSubDomains; preload'
      X-Content-Type-Options: 'nosniff'

  - url: /images
    static_dir: images
    secure: always
    http_headers:
      Strict-Transport-Security: 'max-age=63072000; includeSubDomains; preload'

  - url: /.*
    script: auto
    secure: always
