name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          install_components: cloud-datastore-emulator

      - name: Enable Corepack
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Install build metadata tool
        run: go install github.com/qqiao/app-tools@v1.0.0

      - name: Lint frontend
        run: yarn lint

      - name: Type-check frontend
        run: yarn typecheck

      - name: Run tests
        run: CLOUDSDK_CORE_PROJECT=local-test yarn test

      - name: Build production bundle
        run: CLOUDSDK_CORE_PROJECT=local-test yarn build

      - name: Audit frontend dependencies
        run: yarn npm audit --all --recursive --severity high

      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
