name: build

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Bootstrap development environment
        run: |
          bash -n scripts/setup-dev.sh
          bash scripts/setup-dev.sh
          # Exercise the idempotent path as well as a fresh installation.
          bash scripts/setup-dev.sh
          echo "BASH_ENV=$GITHUB_WORKSPACE/.dev/env.sh" >> "$GITHUB_ENV"

      - name: Vet Go code
        run: go vet ./...

      - name: Run Staticcheck
        run: GOTOOLCHAIN=go1.26.6 go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...

      - name: Lint frontend
        run: yarn lint

      - name: Type-check frontend
        run: yarn typecheck

      - name: Run tests
        run: CLOUDSDK_CORE_PROJECT=local-test yarn test

      - name: Build production bundle
        run: CLOUDSDK_CORE_PROJECT=local-test yarn build

      - name: Audit frontend dependencies
        run: yarn npm audit --all --recursive --severity high

      - name: Scan Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
